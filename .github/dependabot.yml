# Dependabot - version updates
# Doc: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-yml-file
# Questo file deve stare sul branch di default: da li' Dependabot apre le PR di aggiornamento.
version: 2
updates:
  # Backend FastAPI
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Bot Telegram + scraper
  - package-ecosystem: "pip"
    directory: "/bot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Frontend React + Vite
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Immagini base dei Dockerfile
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/bot"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Immagini nei servizi dei docker-compose
  # / -> docker-compose.yml, /infra -> docker-compose.dev.yml
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Azioni usate in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
