name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest bandit
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -r . -f json -o bandit-report.json || true
      - name: Test
        run: pytest --tb=short -q

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest bandit
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -r . -f json -o bandit-report.json || true
      - name: Test
        run: pytest --tb=short -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # stessa major del builder in frontend/Dockerfile (node:22-alpine):
          # Vite 8 richiede Node 20.19+ / 22.12+
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      # Non c'e' uno step di test: il package.json non definisce uno script
      # `test` e non c'e' nessun test runner installato. Il build e' gia' la
      # verifica del FE; i test si aggiungono quando esiste un runner.
      - name: Build
        run: npm run build
