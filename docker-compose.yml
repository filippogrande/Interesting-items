services:
  # --- BE: unico proprietario del DB, espone l'API ---
  app:
    image: filippogrande/interesting-items:backend-latest
    pull_policy: always
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/products
    volumes:
      - /mnt/applicazioni/interesting-items/storage_data:/app/storage_data
      - /mnt/applicazioni/interesting-items/images:/app/images
      - /mnt/applicazioni/interesting-items/tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- BOT: Telegram + scraper. Non accede al DB, parla al BE via HTTP ---
  bot:
    image: filippogrande/interesting-items:bot-latest
    pull_policy: always
    environment:
      # URL pubblico per i link interni nei messaggi (deve puntare a 10.0.0.5:3002)
      - BASE_URL=${BASE_URL:-http://localhost:3002}
      # URL del BE dentro la rete compose
      - API_BASE=http://app:8004
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_URL=redis://redis:6379
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS}
      # --- tuning del worker di scraping (i default sono nel codice) ---
      # pausa fra uno scraping e il successivo (prima fissa a 180s nel codice)
      - BETWEEN_SCRAPES_SECONDS=${BETWEEN_SCRAPES_SECONDS:-20}
      # budget di tempo per singolo scraping, usato solo nelle stime della coda
      - SCRAPE_MAX_SECONDS=${SCRAPE_MAX_SECONDS:-5}
      # tentativi per item: 1 + un retry per ogni valore di backoff
      - SCRAPE_MAX_ATTEMPTS=${SCRAPE_MAX_ATTEMPTS:-3}
      - RETRY_BACKOFF_SECONDS=${RETRY_BACKOFF_SECONDS:-5,15}
      # ogni quanto il watchdog controlla che i worker siano vivi
      - WORKER_WATCHDOG_INTERVAL_SECONDS=${WORKER_WATCHDOG_INTERVAL_SECONDS:-60}
    # stesse dir host del BE: il BE serve /media le immagini scritte dal bot
    volumes:
      - /mnt/applicazioni/interesting-items/storage_data:/app/storage_data
      - /mnt/applicazioni/interesting-items/images:/app/images
      - /mnt/applicazioni/interesting-items/tmp:/app/tmp
    depends_on:
      - app
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
    volumes:
      - /mnt/applicazioni/interesting-items/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  frontend:
    image: filippogrande/interesting-items:frontend-latest
    pull_policy: always
    ports:
      - "3002:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
